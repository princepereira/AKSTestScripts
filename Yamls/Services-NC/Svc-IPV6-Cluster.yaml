apiVersion: v1
kind: Service
metadata:
  labels:
    app: server
  name: server-ipv6-cluster
  namespace: demo
spec:
  ipFamilies:
  - IPv6
  ipFamilyPolicy: SingleStack
  selector:
    app: server
  sessionAffinity: None
  type: LoadBalancer
  ports:
  - name: tcp
    port: {TCP_PORT}
    protocol: TCP
    targetPort: {TCP_PORT}
